name: Skyline Reusable Quality Workflow

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events.
  push:
    branches:
      - '**'
    tags:
      - "[0-9]+.[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+.[0-9]+-**"
      - "[0-9]+.[0-9]+.[0-9]+-**"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:

  detect-target:
    runs-on: ubuntu-latest
    outputs:
      is-common: ${{ steps.detect.outputs.is-common }}
      is-protocol: ${{ steps.detect.outputs.is-protocol }}
    steps:
      - name: Detect target package from tag
        id: detect
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF_TYPE" != "tag" ]]; then
            echo "is-common=true" >> "$GITHUB_OUTPUT"
            echo "is-protocol=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          version_core="${REF_NAME%%-*}"
          dots=$(grep -o '\.' <<< "$version_core" | wc -l)

          if [[ "$dots" -eq 3 ]]; then
            echo "is-common=true" >> "$GITHUB_OUTPUT"
            echo "is-protocol=false" >> "$GITHUB_OUTPUT"
          elif [[ "$dots" -eq 2 ]]; then
            echo "is-common=false" >> "$GITHUB_OUTPUT"
            echo "is-protocol=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Unexpected tag format: $REF_NAME"
            exit 1
          fi
        shell: bash

  CI-ProtocolPackage:
    needs: [detect-target]
    if: needs.detect-target.outputs.is-protocol == 'true'
    uses: SkylineCommunications/_ReusableWorkflows/.github/workflows/Master Workflow.yml@main
    with:
      solution-filter-name: "ProtocolPackage.slnf"

  CI-DataMinerSystemCommonPackage:
    needs: [detect-target]
    if: needs.detect-target.outputs.is-common == 'true'
    uses: SkylineCommunications/_ReusableWorkflows/.github/workflows/Master Workflow.yml@main
    with:
      solution-filter-name: "DataMinerSystemCommonPackage.slnf"